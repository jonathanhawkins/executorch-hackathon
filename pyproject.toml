[project]
name = "executorch-hackathon"
version = "0.1.0"
description = "On-device LLM inference with ExecuTorch"
requires-python = ">=3.10,<3.15"

dependencies = [
    "executorch==1.5.1",
    "optimum-executorch==1.1.0",
    "huggingface_hub",
    "sentencepiece",
    "tiktoken",
    "blobfile",
]

[tool.uv]
# optimum-executorch pins transformers==5.0.0rc1. Without this the resolver
# refuses the whole dependency set rather than just the pre-release.
prerelease = "allow"

[tool.ruff]
line-length = 100
target-version = "py312"
